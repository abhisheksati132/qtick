name: QTick CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('pyproject.toml') }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run tests
        run: |
          python -m pytest tests/ -v
      - name: Run platform demo (quick)
        run: |
          python scripts/run_platform_demo.py

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install linters
        run: pip install ruff black
      - name: Run ruff
        run: ruff check .
      - name: Check formatting
        run: black --check .

  benchmark:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          pip install -e .
          pip install matplotlib
      - name: Run benchmark (small)
        run: python scripts/benchmark.py --episodes 20
      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: results/benchmark.json

  dashboard-smoke:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -e .
      - name: Start dashboard
        run: |
          python webapp/app.py &
          sleep 3
      - name: Smoke test endpoints
        run: |
          curl -sf http://127.0.0.1:5000/ > /dev/null
          curl -sf -X POST http://127.0.0.1:5000/api/simulate \
            -H "Content-Type: application/json" \
            -d '{"policy":"static","algorithm":"RR","quantum":8,"cores":2,"delta":1,"n_processes":10}' > /dev/null
          curl -sf http://127.0.0.1:5000/api/qtable > /dev/null
          echo "Dashboard endpoints OK"